abstract:
  - "I'm one of the <a href=\"https://projects.eclipse.org/projects/iot.zenoh/who\">key developers</a> of the open-source Eclipse Zenoh network protocol library, responsible specifically for the API surface of the project. As leader of the API team, I participated in the design and development of Rust, C, C++, Python, TypeScript, Java, and Kotlin APIs for our library, with the goal of keeping the API uniform across languages and providing a native developer experience. Developer Experience Engineer is, in effect, the job I have been doing for the past four years."
  - "I have a personal project, <a href=\"https://github.com/milyin/prebindgen/\">prebindgen</a>, which grew from this experience and which I'm determined to bring to production-ready quality. It has already <a href=\"https://zenoh.io/blog/2026-08-17-zenoh-1.10/#zenoh-java-and-zenoh-kotlin\">allowed</a> us to accelerate Zenoh-Java and Zenoh-Kotlin by a factor of two, with a significant reduction in manually written code."
  - "The other part of the position that aligns perfectly with my experience is agentic development. I started working in this area at the end of 2025, and by March 2026, I had developed an agentic <a href=\"https://github.com/milyin/zbobr/\">tool</a> with a customizable pipeline controlled through GitHub issues, where it maintained organized context and served context and tools with restricted access through MCP. It wasn't a great success — by that point, Claude and Copilot had become sophisticated enough to make this tool far less useful. However, it gave me valuable experience in the domain."
  - "I hope you will consider my application. Eight years ago, I bet on Rust for its strict correctness guarantees at no cost to performance or production usability. Today we are only at the beginning of designing the right tools for AI, and I'd be happy to be at the core of this process."
